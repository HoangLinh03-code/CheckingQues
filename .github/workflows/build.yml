name: Build Checking Question EXE (Windows)

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    env:
      PYTHONUNBUFFERED: 1
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MATHPIX_APP_KEY: ${{ secrets.MATHPIX_APP_KEY }}
      MATHPIX_APP_ID: ${{ secrets.MATHPIX_APP_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TYPE: ${{ secrets.TYPE }}
      PROJECT_ID: ${{ secrets.PROJECT_ID }}
      PRIVATE_KEY_ID: ${{ secrets.PRIVATE_KEY_ID }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      CLIENT_EMAIL: ${{ secrets.CLIENT_EMAIL }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      AUTH_URI: ${{ secrets.AUTH_URI }}
      TOKEN_URI: ${{ secrets.TOKEN_URI }}
      AUTH_PROVIDER_X509_CERT_URL: ${{ secrets.AUTH_PROVIDER_X509_CERT_URL }}
      CLIENT_X509_CERT_URL: ${{ secrets.CLIENT_X509_CERT_URL }}
      UNIVERSE_DOMAIN: ${{ secrets.UNIVERSE_DOMAIN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Upgrade pip and install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") {
            pip install -r requirements.txt
          }

          # Kiểm tra PyQt5, nếu chưa có thì cài
          $pkg = "PyQt5"
          $check = python -c "import importlib.util, sys; print(importlib.util.find_spec('$pkg') is not None)"
          if ($check -eq "False") {
              Write-Host "$pkg not found. Installing..."
              pip install PyQt5
          } else {
              Write-Host "$pkg already installed."
          }

          pip install pyinstaller

      - name: Build single EXE
        shell: pwsh
        run: |
          pyinstaller --onefile --noconsole Checking.py
          if (!(Test-Path "dist\Checking.exe")) {
            Write-Error "Build failed: EXE not found!"
            exit 1
          }

      - name: Move EXE to artifact folder
        shell: pwsh
        run: |
          mkdir dist_artifact
          move dist\Checking.exe dist_artifact\Checking.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Checking-Tool
          path: dist_artifact/Checking.exe
