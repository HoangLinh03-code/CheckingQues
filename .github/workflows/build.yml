name: Build Checking Question EXE

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: windows-latest

    env:
      PYTHONUNBUFFERED: 1
      MATHPIX_APP_KEY: ${{ secrets.MATHPIX_APP_KEY }}
      MATHPIX_APP_ID: ${{ secrets.MATHPIX_APP_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TYPE: ${{ secrets.TYPE }}
      PROJECT_ID: ${{ secrets.PROJECT_ID }}
      PRIVATE_KEY_ID: ${{ secrets.PRIVATE_KEY_ID }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      CLIENT_EMAIL: ${{ secrets.CLIENT_EMAIL }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      AUTH_URI: ${{ secrets.AUTH_URI }}
      TOKEN_URI: ${{ secrets.TOKEN_URI }}
      AUTH_PROVIDER_X509_CERT_URL: ${{ secrets.AUTH_PROVIDER_X509_CERT_URL }}
      CLIENT_X509_CERT_URL: ${{ secrets.CLIENT_X509_CERT_URL }}
      UNIVERSE_DOMAIN: ${{ secrets.UNIVERSE_DOMAIN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") {
            pip install -r requirements.txt
          }
          # Kiểm tra PyQt5, nếu không có thì cài
          python - <<'EOF'
          import importlib.util, subprocess, sys
          pkg = 'PyQt5'
          if importlib.util.find_spec(pkg) is None:
              print(f"{pkg} not found. Installing...")
              subprocess.check_call([sys.executable, "-m", "pip", "install", pkg])
          else:
              print(f"{pkg} already installed.")
          EOF
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --noconsole Checking.py
        shell: pwsh

      - name: Move EXE to artifact folder
        run: |
          mkdir dist_artifact
          move dist\Checking.exe dist_artifact\
        shell: pwsh

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Checking-Tool
          path: dist_artifact/Checking.exe
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist_artifact/Checking.exe
          tag_name: v${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}        
