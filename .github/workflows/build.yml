name: Build and Release EXE

on:
  push:
    branches:
      - main   # Chạy khi bạn push lên nhánh main (bạn có thể đổi)
  workflow_dispatch:  # Cho phép chạy thủ công trên giao diện GitHub Actions

permissions:
  contents: write    # Cần quyền để tạo release và upload file
  actions: read

jobs:
  build:
    runs-on: windows-latest  # Build file .exe trên môi trường Windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"  # chọn phiên bản phù hợp

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Create .env from GitHub Secrets
        run: |
          echo "OPENAI_KEY=${{ secrets.OPENAI_KEY }}" >> .env
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASS=${{ secrets.DB_PASS }}" >> .env
          echo "OTHER_CONFIG=${{ secrets.OTHER_CONFIG }}" >> .env

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --onefile --noconsole main.py
        # Thay main.py bằng file chính của bạn (ví dụ: Cheking.py)

      - name: Upload EXE as artifact (internal use)
        uses: actions/upload-artifact@v4
        with:
          name: built-exe
          path: dist/*.exe

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          draft: false
          prerelease: false
          files: dist/*.exe
        env:
          TOKEN_GIT: ${{ secrets.TOKEN_GIT }}

