# @format

name: Build Python Executable (with uv)

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Cài Python 3.10
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Cài uv
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ">=0.4.0"
      - name: Install Tesseract OCR (với Tiếng Việt + Tiếng Anh)
        shell: pwsh
        run: |
          choco install tesseract-ocr --params "/LANG=eng+vie"
          # Ghi chú: Thay "eng+vie" bằng các ngôn ngữ bạn cần, ví dụ: "/LANG=eng+jpn+kor"
          # Thêm đường dẫn vào $env:PATH để các lệnh sau có thể tìm thấy
          $tesseractPath = "C:\Program Files\Tesseract-OCR"
          Add-Content -Path $env:GITHUB_PATH -Value $tesseractPath
          Write-Host "Tesseract installed at $tesseractPath and added to PATH"
      # Đồng bộ dependencies qua pyproject.toml
      - name: Sync dependencies with uv
        run: |
          if (Test-Path "uv.lock") {
            uv lock --upgrade
            uv sync --locked
          } else {
            uv sync
          }
        env:
          UV_PYTHON: "3.11"
      # Nếu lần đầu chưa có uv.lock thì dùng: uv sync
      # Nếu bạn vẫn muốn cài riêng PyQt5 (do thường có cấu hình build đặc biệt)
      - name: Install PyQt5 manually
        run: |
          uv pip install PyQt5 PyQt5-Qt5 PyQt5_sip PyQtWebEngine PyQtWebEngine-Qt5
        # Tùy bạn có muốn cho vào dependencies chung trong pyproject.toml thay vì bước riêng này
      - name: Verify PyQt5 installation
        run: |
          uv run python -c "import PyQt5; print('PyQt5 version:', PyQt5.Qt.PYQT_VERSION_STR)"
          uv run python -c "from PyQt5.QtWidgets import QApplication; print('PyQt5 imported successfully')"

      # Tạo file .env từ secret
      - name: Create .env file from ENV_KEY secret
        shell: pwsh
        run: |
          Write-Host "Attempting to display ENV_KEY_CONTENT (will be masked by GitHub):"
          Write-Host $env:ENV_KEY_CONTENT
          Set-Content -Path ".env" -Value $env:ENV_KEY_CONTENT
          Write-Host "File .env created successfully from ENV_KEY secret"
        env:
          ENV_KEY_CONTENT: ${{ secrets.ENV_KEY }}

      # Build .exe bằng PyInstaller
      - name: Build with PyInstaller
        run: |
          uv run pyinstaller --onefile --clean --noconfirm --name CheckDe_V2 `
            --add-data ".env;." `
            --add-data "api;api" `
            --add-data "process;process" `
            --add-data "C:\Program Files\Tesseract-OCR;Tesseract-OCR" `
            Checking.py

      # Tạo archive zip
      - name: Create Zip Archive
        shell: pwsh
        run: |
          $exePath = "dist/CheckDe_V2.exe"
          $promptPath = "prompt.txt"
          $zipPath = "CheckDe_V2_Build.zip"
          Compress-Archive -Path $exePath, $promptPath -DestinationPath $zipPath -Force

      # Tạo GitHub Release và đính kèm file zip
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tagName = "develop-build-${{ github.run_number }}"
          gh release create $tagName CheckDe_V2_Build.zip --generate-notes --title "Develop Build ${{ github.run_number }}" --prerelease
