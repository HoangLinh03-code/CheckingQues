name: Build Windows EXE

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '>=3.9'
    
    - name: Install system dependencies
      run: |
        choco install wget upx -y
    
    - name: Upgrade pip and install wheel
      run: |
        python -m pip install --upgrade pip setuptools wheel
    
    - name: Install PyQt5 separately (fix for GitHub Actions)
      run: |
        pip install PyQt5 PyQt5-Qt5 PyQt5-sip
    
    - name: Install other dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Install PyInstaller
      run: |
        pip install pyinstaller
    
    - name: Verify PyQt5 installation
      run: |
        python -c "import PyQt5; print('PyQt5 version:', PyQt5.Qt.PYQT_VERSION_STR)"
        python -c "from PyQt5.QtWidgets import QApplication; print('PyQt5 imported successfully')"
    
    - name: Create .env file from ENV_KEY secret
      run: |
        # Ghi nội dung của biến môi trường ENV_KEY_CONTENT vào file .env
        # Cách này an toàn vì shell không cố gắng "phân tích cú pháp" nội dung của secret
        Set-Content -Path ".env" -Value $env:ENV_KEY_CONTENT
        Write-Host "File .env created successfully from ENV_KEY secret"
      shell: pwsh
      env:
        # Gán secret vào một biến môi trường, GitHub Actions sẽ xử lý các ký tự đặc biệt một cách an toàn
        ENV_KEY_CONTENT: ${{ secrets.ENV_KEY }}
      
    # === ĐÃ XÓA STEP 'Create spec file for PyInstaller' ===
    
    - name: Build with PyInstaller
      run: |
        pyinstaller --clean --noconfirm --name CheckDe_V2 --add-data ".env;." --add-data "api;api" --add-data "process;process" Checking.py
      shell: pwsh
      env:
        PYTHONOPTIMIZE: 1
    
    - name: Verify build output
      run: |
        if (Test-Path "dist/CheckDe_V2.exe") {
          Write-Host "EXE file created successfully"
          $fileInfo = Get-Item "dist/CheckDe_V2.exe"
          Write-Host "File size: $($fileInfo.Length / 1MB) MB"
        } else {
          Write-Host "EXE file not found!"
          exit 1
        }
      shell: pwsh
    
    - name: Create release package
      run: |
        # Tạo thư mục release
        New-Item -ItemType Directory -Force -Path "release"
        
        # Copy exe
        Copy-Item "dist/CheckDe_V2.exe" "release/"
        
        # Copy prompt.txt (assuming it's in the root)
        Copy-Item "prompt.txt" "release/"
        
        # Tạo README cho người dùng
        $readmeContent = @"
        # CheckDe V2 - Hướng dẫn sử dụng
                
        ## Cài đặt
        1. Tải về file CheckDe_V2.exe, README.txt và prompt.txt
        2. Đặt tất cả các file trong cùng một thư mục
        3. Chạy CheckDe_V2.exe
                
        ## Lưu ý
        - File .exe đã được build với tất cả credentials cần thiết
        - Không cần cài đặt Python hay dependencies
        - Chỉ chạy trên Windows 10/11
                
        ## Tính năng
        - Hỗ trợ hình ảnh & công thức toán
        - Check đề thi tự động với AI
        - Export kết quả ra file Word
                
        ## Hỗ trợ
        Nếu gặp vấn đề, vui lòng tạo issue trên GitHub.
        "@
        Set-Content -Path "release/README.txt" -Value $readmeContent
        
        Write-Host "Release package created"
      shell: pwsh
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: CheckDe-Windows-EXE
        path: release/
        retention-days: 30
    
    # === ĐÃ XÓA STEP 'Create ZIP for Release' ===
    
    - name: Create Release (on tag push)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: release/* # Tải lên tất cả file trong thư mục release
        body: |
          ## CheckDe V2 - Windows Release
          
          ### Tải xuống
          - Tải về `CheckDe_V2.exe`, `README.txt` và `prompt.txt`
          - Đặt chung vào một thư mục và chạy file `.exe`
          
          ### Tính năng
          - Hỗ trợ hình ảnh & công thức toán
          - Check đề thi tự động với AI
          - Export kết quả ra file Word
          
          ### Yêu cầu hệ thống
          - Windows 10/11
          - Không cần cài đặt Python
          
          ### Hỗ trợ
          Báo lỗi tại [Issues](https://github.com/${{ github.repository }}/issues)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
