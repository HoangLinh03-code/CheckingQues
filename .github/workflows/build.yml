name: Build Windows EXE

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '>=3.10'
    
    - name: Install system dependencies
      run: |
        choco install wget -y
    
    - name: Upgrade pip and install wheel
      run: |
        python -m pip install --upgrade pip setuptools wheel
    
    - name: Install PyQt5 separately (fix for GitHub Actions)
      run: |
        pip install PyQt5==5.15.11 PyQt5-Qt5==5.15.2 PyQt5-sip==12.17.0
    
    - name: Install other dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Install PyInstaller
      run: |
        pip install pyinstaller
    
    - name: Verify PyQt5 installation
      run: |
        python -c "import PyQt5; print('PyQt5 version:', PyQt5.Qt.PYQT_VERSION_STR)"
        python -c "from PyQt5.QtWidgets import QApplication; print('PyQt5 imported successfully')"
    
    - name: Inject credentials into callApi.py
      run: |
        # Tạo JSON cho Google Cloud credentials
        $creds = @{
          type = "${{ secrets.TYPE }}"
          project_id = "${{ secrets.PROJECT_ID }}"
          private_key_id = "${{ secrets.PRIVATE_KEY_ID }}"
          private_key = "${{ secrets.PRIVATE_KEY }}"
          client_email = "${{ secrets.CLIENT_EMAIL }}"
          client_id = "${{ secrets.CLIENT_ID }}"
          auth_uri = "${{ secrets.AUTH_URI }}"
          token_uri = "${{ secrets.TOKEN_URI }}"
          auth_provider_x509_cert_url = "${{ secrets.AUTH_PROVIDER_X509_CERT_URL }}"
          client_x509_cert_url = "${{ secrets.CLIENT_X509_CERT_URL }}"
          universe_domain = "${{ secrets.UNIVERSE_DOMAIN }}"
        }
        $json = $creds | ConvertTo-Json -Compress
        $json = $json -replace '"', '\"'
        
        # Inject vào callApi.py
        $content = Get-Content -Path "api/callApi.py" -Raw
        $content = $content -replace 'EMBEDDED_CREDS = ""', "EMBEDDED_CREDS = `"$json`""
        Set-Content -Path "api/callApi.py" -Value $content
        
        Write-Host "Google Cloud credentials injected successfully"
      shell: pwsh
    
    - name: Create .env file for build (embedded credentials)
      run: |
        $envContent = @"
        MATHPIX_APP_KEY=${{ secrets.MATHPIX_APP_KEY }}
        MATHPIX_APP_ID=${{ secrets.MATHPIX_APP_ID }}
        GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
        TYPE=${{ secrets.TYPE }}
        PROJECT_ID=${{ secrets.PROJECT_ID }}
        PRIVATE_KEY_ID=${{ secrets.PRIVATE_KEY_ID }}
        PRIVATE_KEY=${{ secrets.PRIVATE_KEY }}
        CLIENT_EMAIL=${{ secrets.CLIENT_EMAIL }}
        CLIENT_ID=${{ secrets.CLIENT_ID }}
        AUTH_URI=${{ secrets.AUTH_URI }}
        TOKEN_URI=${{ secrets.TOKEN_URI }}
        AUTH_PROVIDER_X509_CERT_URL=${{ secrets.AUTH_PROVIDER_X509_CERT_URL }}
        CLIENT_X509_CERT_URL=${{ secrets.CLIENT_X509_CERT_URL }}
        UNIVERSE_DOMAIN=${{ secrets.UNIVERSE_DOMAIN }}
        OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
        "@
        Set-Content -Path ".env" -Value $envContent
        Write-Host ".env file created for build"
      shell: pwsh
    
    - name: Create spec file for PyInstaller
      run: |
        $specContent = @"
        # -*- mode: python ; coding: utf-8 -*-
        
        block_cipher = None
        
        a = Analysis(
            ['process/Checking.py'],
            pathex=[],
            binaries=[],
            datas=[
                ('.env', '.'),
            ],
            hiddenimports=[
                'PyQt5',
                'PyQt5.QtCore',
                'PyQt5.QtGui',
                'PyQt5.QtWidgets',
                'google.oauth2.service_account',
                'google.auth.transport.requests',
                'vertexai',
                'vertexai.generative_models',
                'docx',
                'lxml',
                'lxml.etree',
                'PIL',
                'dotenv',
                'python-dotenv',
            ],
            hookspath=[],
            hooksconfig={},
            runtime_hooks=[],
            excludes=[],
            win_no_prefer_redirects=False,
            win_private_assemblies=False,
            cipher=block_cipher,
            noarchive=False,
        )
        
        pyz = PYZ(a.pure, a.zipped_data, cipher=block_cipher)
        
        exe = EXE(
            pyz,
            a.scripts,
            a.binaries,
            a.zipfiles,
            a.datas,
            [],
            name='CheckDe_V2',
            debug=False,
            bootloader_ignore_signals=False,
            strip=False,
            upx=True,
            upx_exclude=[],
            runtime_tmpdir=None,
            console=False,
            disable_windowed_traceback=False,
            argv_emulation=False,
            target_arch=None,
            codesign_identity=None,
            entitlements_file=None,
            icon=None,
        )
        "@
        Set-Content -Path "CheckDe.spec" -Value $specContent
        Write-Host "Spec file created"
      shell: pwsh
    
    - name: Build with PyInstaller
      run: |
        pyinstaller --clean --noconfirm CheckDe.spec
      env:
        PYTHONOPTIMIZE: 1
    
    - name: Verify build output
      run: |
        if (Test-Path "dist/CheckDe_V2.exe") {
          Write-Host "EXE file created successfully"
          $fileInfo = Get-Item "dist/CheckDe_V2.exe"
          Write-Host "File size: $($fileInfo.Length / 1MB) MB"
        } else {
          Write-Host "EXE file not found!"
          exit 1
        }
      shell: pwsh
    
    - name: Create release package
      run: |
        # Tạo thư mục release
        New-Item -ItemType Directory -Force -Path "release"
        
        # Copy exe
        Copy-Item "dist/CheckDe_V2.exe" "release/"
        
        # Tạo README cho người dùng
        $readmeContent = @"
        # CheckDe V2 - Hướng dẫn sử dụng
        
        ## Cài đặt
        1. Giải nén file zip
        2. Chạy CheckDe_V2.exe
        
        ## Lưu ý
        - File .exe đã được build với tất cả credentials cần thiết
        - Không cần cài đặt Python hay dependencies
        - Chỉ chạy trên Windows 10/11
        
        ## Tính năng
        - Hỗ trợ hình ảnh & công thức toán
        - Check đề thi tự động với AI
        - Export kết quả ra file Word
        
        ## Hỗ trợ
        Nếu gặp vấn đề, vui lòng tạo issue trên GitHub.
        "@
        Set-Content -Path "release/README.txt" -Value $readmeContent
        
        Write-Host "Release package created"
        shell: pwsh
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: CheckDe-Windows-EXE
        path: release/
        retention-days: 30
    
    - name: Create ZIP for Release
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        Compress-Archive -Path "release/*" -DestinationPath "CheckDe_V2_Windows.zip"
        Write-Host "ZIP file created for release"
      shell: pwsh
    
    - name: Create Release (on tag push)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: CheckDe_V2_Windows.zip
        body: |
          ## CheckDe V2 - Windows Release
          
          ### Tải xuống
          - Download file ZIP
          - Giải nén và chạy `CheckDe_V2.exe`
          
          ### Tính năng
          - Hỗ trợ hình ảnh & công thức toán
          - Check đề thi tự động với AI
          - Export kết quả ra file Word
          
          ### Yêu cầu hệ thống
          - Windows 10/11
          - Không cần cài đặt Python
          
          ### Hỗ trợ
          Báo lỗi tại [Issues](https://github.com/${{ github.repository }}/issues)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
