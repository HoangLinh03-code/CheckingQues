name: Build and Release EXE

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Embed Google Credentials into callApi.py
        run: |
          echo "import os, json, pathlib" > inject_creds.py
          echo "creds = {" >> inject_creds.py
          echo "    'type': os.getenv('TYPE')," >> inject_creds.py
          echo "    'project_id': os.getenv('PROJECT_ID')," >> inject_creds.py
          echo "    'private_key_id': os.getenv('PRIVATE_KEY_ID')," >> inject_creds.py
          echo "    'private_key': os.getenv('PRIVATE_KEY', '').replace('\\n', '\\\\n')," >> inject_creds.py
          echo "    'client_email': os.getenv('CLIENT_EMAIL')," >> inject_creds.py
          echo "    'client_id': os.getenv('CLIENT_ID')," >> inject_creds.py
          echo "    'auth_uri': os.getenv('AUTH_URI')," >> inject_creds.py
          echo "    'token_uri': os.getenv('TOKEN_URI')," >> inject_creds.py
          echo "    'auth_provider_x509_cert_url': os.getenv('AUTH_PROVIDER_X509_CERT_URL')," >> inject_creds.py
          echo "    'client_x509_cert_url': os.getenv('CLIENT_X509_CERT_URL')," >> inject_creds.py
          echo "    'universe_domain': os.getenv('UNIVERSE_DOMAIN')" >> inject_creds.py
          echo "}" >> inject_creds.py
          echo "json_str = json.dumps(creds)" >> inject_creds.py
          echo "target = pathlib.Path('api/callApi.py')" >> inject_creds.py
          echo "content = target.read_text(encoding='utf-8')" >> inject_creds.py
          echo "new_header = f'EMBEDDED_CREDS = \"\"\"{json_str}\"\"\"\\n'" >> inject_creds.py
          echo "if 'EMBEDDED_CREDS' in content:" >> inject_creds.py
          echo "    lines = content.splitlines()" >> inject_creds.py
          echo "    for i, line in enumerate(lines):" >> inject_creds.py
          echo "        if line.strip().startswith('EMBEDDED_CREDS'):" >> inject_creds.py
          echo "            lines[i] = new_header.strip()" >> inject_creds.py
          echo "            break" >> inject_creds.py
          echo "    content = '\\n'.join(lines)" >> inject_creds.py
          echo "else:" >> inject_creds.py
          echo "    content = new_header + content" >> inject_creds.py
          echo "target.write_text(content, encoding='utf-8')" >> inject_creds.py
          python inject_creds.py
        env:
          TYPE: ${{ secrets.TYPE }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          PRIVATE_KEY_ID: ${{ secrets.PRIVATE_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          CLIENT_EMAIL: ${{ secrets.CLIENT_EMAIL }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          AUTH_URI: ${{ secrets.AUTH_URI }}
          TOKEN_URI: ${{ secrets.TOKEN_URI }}
          AUTH_PROVIDER_X509_CERT_URL: ${{ secrets.AUTH_PROVIDER_X509_CERT_URL }}
          CLIENT_X509_CERT_URL: ${{ secrets.CLIENT_X509_CERT_URL }}
          UNIVERSE_DOMAIN: ${{ secrets.UNIVERSE_DOMAIN }}

      - name: Verify PyQt5 installation
        run: |
          python -m pip show PyQt5
          python -c "import PyQt5; print('PyQt5 imported successfully')"

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --onefile --noconsole Checking.py

      - name: Upload built EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-exe
          path: dist/*.exe

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          body: "Build tu dong tu nhanh ${GITHUB_REF_NAME}"
          draft: false
          prerelease: false
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
